<title id="title">HuMoTAR refinement loop</title><desc id="desc">Astra produces references and wrist and finger impedance control code. End-effector references pass through IK into the joint-space reference. SONIC and the wrist and finger controller execute in MuJoCo. Object tracking, contact forces, object velocity, grasp checks and inspected images provide simulation feedback.</desc>
