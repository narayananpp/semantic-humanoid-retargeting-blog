<title id="title">Refinement of the HOI-Retarget joint-space reference</title><desc id="desc">Astra revises the initial joint-space motion through code. Body posture and timing edits, wrist inverse kinematics and finger joint targets produce whole-body and wrist/finger references. SONIC controls the body; Astra also writes the wrist and finger impedance controller. Simulation feedback returns to Astra.</desc>
