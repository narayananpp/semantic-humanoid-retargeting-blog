<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
<title id="title">HuMoTAR refinement loop</title><desc id="desc">Human and kinematic references enter Astra. Wrist references pass through IK to joint targets. Body and finger references supply targets directly. SONIC and joint impedance execute the motion in MuJoCo. Recorded queries, images and object-tracking measurements return to Astra.</desc>
