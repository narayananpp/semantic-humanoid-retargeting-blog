<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-labelledby="title desc">
<title id="title">Single-agent motion refinement through simulation feedback</title><desc id="desc">A human demonstration and HOI-Retarget reference enter Astra. Generated body references go to SONIC; wrist poses go through inverse kinematics and arm and finger targets go to joint impedance control. MuJoCo records the execution. Images, object-tracking errors and contact measurements return to Astra for the next revision.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#167c77"/></marker></defs>
