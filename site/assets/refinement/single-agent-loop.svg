<g font-family="Arial,sans-serif" fill="#242620">
<text x="30" y="43" font-size="23" font-weight="bold">Motion refinement through simulation feedback</text>
<g fill="#fff" stroke="#cdd1cc"><rect x="30" y="85" width="200" height="75" rx="8"/><rect x="30" y="222" width="200" height="75" rx="8"/><rect x="500" y="108" width="210" height="165" rx="8"/><rect x="760" y="108" width="220" height="165" rx="8"/><rect x="1030" y="108" width="335" height="165" rx="8"/></g>
<rect x="280" y="108" width="170" height="165" rx="8" fill="#fbf3df" stroke="#c5a55c"/>
<text x="130" y="117" text-anchor="middle" font-size="17" font-weight="bold">Human demonstration</text><text x="130" y="143" text-anchor="middle" font-size="14">SMPL</text>
<text x="130" y="252" text-anchor="middle" font-size="17" font-weight="bold">Humanoid reference</text><text x="130" y="278" text-anchor="middle" font-size="14">Kinematic motion</text>
<text x="144" y="188" font-size="12">HOI-Retarget</text><text x="144" y="204" font-size="11">Kinematic retargeting</text>
<text x="365" y="153" text-anchor="middle" font-size="22" font-weight="bold">GPT-6 Astra</text><text x="365" y="193" text-anchor="middle" font-size="14">Writes and revises</text><text x="365" y="215" text-anchor="middle" font-size="14">motion + control code</text>
<text x="605" y="141" text-anchor="middle" font-size="16" font-weight="bold">Body reference</text><text x="605" y="184" text-anchor="middle" font-size="15">Wrist poses → IK</text><text x="605" y="211" text-anchor="middle" font-size="13">Arm joint targets</text><text x="605" y="247" text-anchor="middle" font-size="15">Finger targets</text>
<text x="870" y="146" text-anchor="middle" font-size="19" font-weight="bold">SONIC</text><text x="870" y="169" text-anchor="middle" font-size="13">Whole-body policy</text><text x="870" y="220" text-anchor="middle" font-size="18" font-weight="bold">Joint impedance</text><text x="870" y="246" text-anchor="middle" font-size="13">Arms + fingers</text>
<text x="1197" y="166" text-anchor="middle" font-size="22" font-weight="bold">MuJoCo rollout</text><text x="1197" y="203" text-anchor="middle" font-size="15">Executed robot + object motion</text>
